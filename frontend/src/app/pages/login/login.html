<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">L</div>
      <h1>LogiTrack</h1>
      <p>Logistics & Delivery Management</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading">

        @if (loading) {
          Signing in...
        } @else {
          Sign in
        }

      </button>

    </form>

    <p class="switch-auth">
      Don't have an account?
      <a routerLink="/register">Create account</a>
    </p>

  </div>

</div>
